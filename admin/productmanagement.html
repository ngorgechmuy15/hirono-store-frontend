<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Management - Hirono Cambodia Admin</title>
  <link rel="stylesheet" href="productmanagement.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link 
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" 
    rel="stylesheet"
  />
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
  />
</head>
<body>
  <div class="admin-container">
    <!-- SIDEBAR -->
    <div id="sidebar-placeholder"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- HEADER -->
      <header class="page-header">
        <h1>Product Management</h1>
        <p>Add, update, and remove products</p>
      </header>

      <!-- ADD / EDIT PRODUCT FORM CARD -->
      <section class="card-section">
        <h2 class="card-title" id="form-card-title">Add New Product</h2>
        <form class="product-form" id="product-form">
          <input type="hidden" id="p-editing-id" value="" />
          <div class="form-grid">
            <!-- Row 1: Name, Series, Price -->
            <div class="form-group">
              <label for="p-name">NAME *</label>
              <input type="text" id="p-name" placeholder="Hirono Forest Wanderer" required />
            </div>

            <div class="form-group">
              <label for="p-series">SERIES / COLLECTION *</label>
              <input type="text" id="p-series" placeholder="Forest Dreams" required />
            </div>

            <div class="form-group">
              <label for="p-price">PRICE ($) *</label>
              <input type="text" id="p-price" placeholder="24.99" required />
            </div>

            <!-- Row 2: Type, Image URL -->
            <div class="form-group">
              <label for="p-type">TYPE *</label>
              <select id="p-type" required>
                <option value="Figures">Figures</option>
                <option value="Plush Dolls">Plush Dolls</option>
                <option value="Accessories">Accessories</option>
              </select>
            </div>

            <div class="form-group span-2">
              <label for="p-image">IMAGE URL *</label>
              <input type="text" id="p-image" placeholder="images/hirono-figures/example.webp or https://..." required />
            </div>
          </div>

          <!-- Checkboxes & Add Button -->
          <div class="form-checkboxes">
            <label class="checkbox-label">
              <input type="checkbox" id="chk-new" />
              <span>Mark as New</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="chk-popular" />
              <span>Mark as Popular</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="chk-limited" />
              <span>Mark as Limited</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="chk-visible" checked />
              <span>Visible on website</span>
            </label>
          </div>

          <div style="display:flex; gap:12px;">
            <button type="submit" class="btn-add-product" id="p-submit-btn">
              <i class="fa-solid fa-plus"></i> Add Product
            </button>
            <button type="button" class="btn-action" id="p-cancel-edit-btn" style="display:none;">
              Cancel
            </button>
          </div>
        </form>
      </section>

      <!-- ALL PRODUCTS TABLE CARD -->
      <section class="card-section">
        <h2 class="card-title" id="products-count-title">All Products (0)</h2>
        <div class="table-container">
          <table class="products-table">
            <thead>
              <tr>
                <th>IMAGE</th>
                <th>NAME</th>
                <th>SERIES</th>
                <th>TYPE</th>
                <th>PRICE</th>
                <th>FLAGS</th>
                <th>VISIBLE</th>
                <th>ACTION</th>
              </tr>
            </thead>
            <tbody id="products-table-body">
              <tr>
                <td colspan="8" class="no-data">Loading products&hellip;</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="../products-data.js"></script>
  <script src="../product-store.js"></script>
  <script src="sidebar.js"></script>
  <script src="productmanagement.js"></script>
</body>
</html>
